<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKM — AI Skill Manager</title>
    <meta name="description" content="Manage and deploy AI Agent Skills with a visual interface">
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <header class="mobile-header">
        <button class="icon-btn" id="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <span class="mobile-brand"><span class="mobile-brand-mark">S</span> SKM</span>
        <button class="btn-lang" id="mobile-lang-toggle" type="button">中文</button>
    </header>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-mark">S</span>
                <span class="logo-text">SKM</span>
            </div>
            <p class="logo-sub">AI Skill Manager</p>
        </div>
        <div class="nav-menu" id="nav-menu">
            <button class="nav-item active" type="button" data-page="dashboard">
                <span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span>
                <span class="nav-label">Dashboard</span>
            </button>
            <button class="nav-item" type="button" data-page="library">
                <span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H20v15.5H6.5A2.5 2.5 0 0 1 4 17V6.5Z"/><path d="M4 17a2.5 2.5 0 0 1 2.5-2.5H20M8 8h8"/></svg></span>
                <span class="nav-label">My Skills</span>
            </button>
            <button class="nav-item" type="button" data-page="projects">
                <span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5A2.5 2.5 0 0 1 6 4h4l2 2h6A2.5 2.5 0 0 1 20.5 8.5v8A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5v-10Z"/></svg></span>
                <span class="nav-label">Projects</span>
            </button>
        </div>
        <div class="sidebar-footer">
            <div class="sidebar-footer-row">
                <span class="version-label" id="version-label">v...</span>
                <button class="btn-lang" id="lang-toggle" type="button" title="Switch language">中文</button>
            </div>
        </div>
    </nav>

    <main class="main-content" id="main-content">
        <div class="loading-full" id="initial-loading">
            <div class="spinner"></div>
            <p>Loading SKM...</p>
        </div>
    </main>

    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="false"></div>

    <script src="/app.js"></script>
    <script src="/components/dashboard.js"></script>
    <script src="/components/library.js"></script>
    <script src="/components/projects.js"></script>
</body>
</html>
