name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-app:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test macOS App
        run: |
          xcodebuild -quiet \
            -workspace macos/SKM.xcworkspace \
            -scheme SKM \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/skm-tests" \
            test

      - name: Verify macOS release secrets
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.MACOS_NOTARY_PRIVATE_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          for name in \
            MACOS_DEVELOPER_ID_P12_BASE64 \
            MACOS_DEVELOPER_ID_P12_PASSWORD \
            MACOS_NOTARY_PRIVATE_KEY_BASE64 \
            MACOS_NOTARY_KEY_ID \
            MACOS_NOTARY_ISSUER_ID; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Import Developer ID and notarization credentials
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.MACOS_NOTARY_PRIVATE_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          signing_root="$RUNNER_TEMP/skm-signing"
          keychain_path="$RUNNER_TEMP/skm-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$signing_root/developer-id.p12"
          notary_key_path="$signing_root/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"

          mkdir -p "$signing_root"
          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$MACOS_NOTARY_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | \
            sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [ -z "$signing_identity" ]; then
            echo "::error::The P12 does not contain a valid Developer ID Application identity"
            exit 1
          fi

          echo "SKM_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "SKM_NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"
          echo "SKM_NOTARY_KEY_ID=$MACOS_NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "SKM_NOTARY_ISSUER_ID=$MACOS_NOTARY_ISSUER_ID" >> "$GITHUB_ENV"
          echo "SKM_RELEASE_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and package macOS App
        run: |
          sh macos/Scripts/package-release.sh \
            --version "$GITHUB_REF_NAME" \
            --build "$GITHUB_RUN_NUMBER" \
            --output dist/macos

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: skm-macos-app
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${SKM_RELEASE_KEYCHAIN:-}" ] && [ -f "$SKM_RELEASE_KEYCHAIN" ]; then
            security delete-keychain "$SKM_RELEASE_KEYCHAIN"
          fi

  verify-macos-app:
    needs: macos-app
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-26
          - macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download macOS release artifacts
        uses: actions/download-artifact@v7
        with:
          name: skm-macos-app
          path: dist/macos

      - name: Verify notarized App on clean runner
        run: |
          version="${GITHUB_REF_NAME#v}"
          extract_root="$RUNNER_TEMP/skm-app"
          runtime_root="$RUNNER_TEMP/skm-runtime"

          cd dist/macos
          shasum -a 256 -c "SKM-$version-checksums.txt"
          ditto -x -k "SKM-$version-universal.zip" "$extract_root"

          app="$extract_root/SKM.app"
          core="$app/Contents/Resources/skm-core"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "SKM-$version-universal.dmg"
          spctl --assess --type execute --verbose=2 "$app"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=2 \
            "SKM-$version-universal.dmg"

          architecture="$(uname -m)"
          lipo -verify_arch "$architecture" "$app/Contents/MacOS/SKM"
          lipo -verify_arch "$architecture" "$core"
          test "$(env -i PATH=/usr/bin:/bin "$core" version)" = "$version"

          mkdir -p "$runtime_root/user" "$runtime_root/project"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":"1","method":"system.handshake","params":{"protocolVersion":1}}' | \
            env -i PATH=/usr/bin:/bin "$core" \
              --home "$runtime_root/state" \
              --user-home "$runtime_root/user" \
              --project "$runtime_root/project" \
              core --stdio | grep -q '"protocolVersion":1'

          env -i \
            PATH=/usr/bin:/bin \
            SKM_HOME="$runtime_root/state" \
            SKM_USER_HOME="$runtime_root/user" \
            SKM_PROJECT="$runtime_root/project" \
            SKM_SKIP_WELCOME=1 \
            "$app/Contents/MacOS/SKM" > "$runtime_root/app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$runtime_root/app.log"
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" 2>/dev/null || true
          trap - EXIT

  release:
    needs: verify-macos-app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Test distribution scripts
        run: |
          sh scripts/install_test.sh
          sh scripts/generate_homebrew_formula_test.sh

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Homebrew Tap write access
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          can_push=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/zzzzzyijie/homebrew-tap | \
            jq -r '.permissions.push // false')
          if [ "$can_push" != true ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN cannot write zzzzzyijie/homebrew-tap"
            exit 1
          fi

      - name: Generate Homebrew Formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p .homebrew-formula
          sh scripts/generate_homebrew_formula.sh \
            "$RELEASE_TAG" \
            dist/checksums.txt \
            .homebrew-formula/skm.rb

      - name: Publish Homebrew Formula
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const owner = "zzzzzyijie";
            const repo = "homebrew-tap";
            const path = "Formula/skm.rb";
            const branch = "main";
            const content = fs.readFileSync(".homebrew-formula/skm.rb").toString("base64");
            const message = `Formula update for skm ${process.env.RELEASE_TAG}`;

            for (let attempt = 1; attempt <= 3; attempt += 1) {
              let sha;
              try {
                const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
                if (Array.isArray(current.data)) {
                  throw new Error(`${path} is a directory, not a Formula file`);
                }
                sha = current.data.sha;
                if (current.data.content.replace(/\n/g, "") === content) {
                  core.info(`${path} is already current`);
                  return;
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }

              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path, branch, content, message, sha,
                });
                core.info(`Published ${path} on attempt ${attempt}`);
                return;
              } catch (error) {
                if (attempt === 3 || ![409, 422].includes(error.status)) {
                  throw error;
                }
                core.warning(`Formula update conflicted on attempt ${attempt}; retrying`);
                await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
              }
            }

  publish-macos-app:
    needs:
      - macos-app
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS release artifacts
        uses: actions/download-artifact@v7
        with:
          name: skm-macos-app
          path: dist/macos

      - name: Attach macOS App to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/macos/* --clobber --repo "$GITHUB_REPOSITORY"
