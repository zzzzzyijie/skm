name: Recover macOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      source_run_id:
        description: Release run with verified macOS artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  attach-verified-app:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - name: Verify artifact provenance and completed macOS checks
        run: |
          printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          printf '%s' "$SOURCE_RUN_ID" | grep -Eq '^[0-9]+$'
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > /tmp/source-run.json
          test "$(jq -r .path /tmp/source-run.json)" = '.github/workflows/release.yml'
          test "$(jq -r .head_sha /tmp/source-run.json)" = "$(git rev-parse HEAD)"
          test "$(jq -r .status /tmp/source-run.json)" = completed
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > /tmp/source-jobs.json
          for job in 'macos-app' 'verify-macos-app (macos-26)' 'verify-macos-app (macos-26-intel)'; do
            jq -e --arg job "$job" '.jobs | any(.name == $job and .conclusion == "success")' /tmp/source-jobs.json
          done
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft == false' | grep -qx true
      - uses: actions/download-artifact@v7
        with:
          name: skm-macos-app
          path: dist/macos
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify checksums and attach existing artifacts
        run: |
          cd dist/macos
          sha256sum -c "SKM-${RELEASE_TAG#v}-checksums.txt"
          gh release upload "$RELEASE_TAG" ./* --clobber
